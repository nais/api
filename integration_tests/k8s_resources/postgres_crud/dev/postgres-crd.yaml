apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgres.nais.io
spec:
  group: nais.io
  names:
    kind: Postgres
    plural: postgres
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                majorVersion:
                  type: string
                  enum: ["18", "17", "16"]
