apiVersion: nais.io/v1
kind: Postgres
metadata:
  name: orders
  namespace: postgres-workload-team
spec:
  majorVersion: "17"
status:
  clusterName: pg-orders-main-65648812
  activeBranch: main
---
apiVersion: nais.io/v1
kind: Postgres
metadata:
  name: reports
  namespace: postgres-workload-team
spec:
  majorVersion: "17"
status:
  clusterName: pg-reports-main-preserved
  activeBranch: main
---
apiVersion: nais.io/v1
kind: Postgres
metadata:
  name: archive
  namespace: postgres-workload-team
spec:
  majorVersion: "18"
  activeBranch: pending
---
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: consumer
  namespace: postgres-workload-team
spec:
  image: ghcr.io/nais/testapp:latest
  uses:
    postgres:
      - name: orders
        role: read
      - name: reports
        envPrefix: REPORTS_
      - name: archive
        envPrefix: ARCHIVE_
---
apiVersion: nais.io/v1
kind: Naisjob
metadata:
  name: scheduled-reader
  namespace: postgres-workload-team
spec:
  image: ghcr.io/nais/testapp:latest
  schedule: "0 0 * * *"
  uses:
    postgres:
      - name: orders
        branch: main
      - name: reports
        envPrefix: REPORTS_
      - name: archive
        envPrefix: ARCHIVE_
