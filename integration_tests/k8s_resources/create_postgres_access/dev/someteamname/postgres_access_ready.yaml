apiVersion: nais.io/v1
kind: PostgresAccess
metadata:
  name: ready-access
  namespace: someteamname
  uid: 11111111-1111-4111-8111-111111111111
spec:
  postgresInstance: foobar
  username: user@usersen.com
  accessLevel: readwrite
  expiresAt: "2099-09-17T12:00:00Z"
status:
  databaseRole: user-foobar-role
  relayAccess: ready-access
  tokenSecret: ready-access-relay-token
  conditions:
    - type: Ready
      status: "True"
      reason: Ready
      message: "database role and relay mapping are ready"
