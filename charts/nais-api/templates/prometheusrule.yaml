{{ if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: "{{ .Release.Name }}"
  labels:
    app: "{{ .Release.Name }}"
spec:
  groups:
    - name: "{{ .Release.Name }}-alerts"
      rules:
        - alert: Hookd requests failing
          expr: increase(errors_total{job="{{ .Release.Name }}", component="hookd-client"}[2m]) > 0
          for: 5m
          labels:
            namespace: nais-system
            severity: critical
            ping: nais-vakt
          annotations:
            consequence: Users may not be able to see deployments in console.
            action: "Check logs in {{ .Release.Name }} and hookd"
        - alert: Kubernetes API server requests failing
          expr: increase(errors_total{job="{{ .Release.Name }}", component="k8s-client"}[2m]) > 0
          for: 5m
          labels:
            namespace: nais-system
            severity: critical
            ping: nais-vakt
          annotations:
            consequence: Users may not be able to see workload information in console.
            action: "Check logs in {{ .Release.Name }}"
        - alert: Cost updater has not updated cost in 24 hours
          expr: absent_over_time(nais_api_cost_updater_runs_total{container="nais-api",success="true"}[24h])
          for: 4h
          labels:
            namespace: nais-system
            severity: warning
          annotations:
            consequence: Cost information may be outdated.
            action: "Check logs in {{ .Release.Name }}"
        - alert: User sync has not succeeded in 45 minutes
          expr: |
            time() - max(max_over_time(nais_usersync_last_success_timestamp_seconds{job="nais-system/{{ .Release.Name }}"}[45m])) > 45 * 60
            or
            (max(absent_over_time(nais_usersync_last_success_timestamp_seconds{job="nais-system/{{ .Release.Name }}"}[45m]))
             and max(up{job="nais-system/{{ .Release.Name }}"} offset 45m))
          labels:
            namespace: nais-system
            severity: warning
          annotations:
            consequence: User and admin access may be out of date.
            action: "Check usersync errors in {{ .Release.Name }} logs."
{{- end }}
