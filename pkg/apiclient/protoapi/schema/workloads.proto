syntax = "proto3";

package nais.api.protobuf;

option go_package = "./pkg/apiclient/protoapi";

// An application and a job cannot share a name in a team, so team and name identify a
// workload within an environment.
message WorkloadImage {
  string team_slug = 1;
  string name = 2;
  // The workload's effective image reference, as deployed: a tag, a digest, or both.
  string image = 3;
}

message EnvironmentWorkloadImages {
  string environment = 1;
  repeated WorkloadImage workloads = 2;
}

service Workloads {
  // ListImages returns the image of every application and job, by environment. It is not
  // paginated, so that a client gets every workload in one response. Only environments
  // whose caches are synced are included, and an included environment's list is complete.
  // Workloads in nais-system are not included.
  rpc ListImages(ListWorkloadImagesRequest) returns (ListWorkloadImagesResponse) {}
}

message ListWorkloadImagesRequest {}

message ListWorkloadImagesResponse {
  repeated EnvironmentWorkloadImages environments = 1;
}
