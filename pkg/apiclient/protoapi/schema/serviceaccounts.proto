syntax = "proto3";

package nais.api.protobuf;

import "google/protobuf/timestamp.proto";

option go_package = "./pkg/apiclient/protoapi";

service ServiceAccounts {
  rpc Create(CreateServiceAccountRequest) returns (CreateServiceAccountResponse) {}
  rpc CreateToken(CreateServiceAccountTokenRequest) returns (CreateServiceAccountTokenResponse) {}
}

message CreateServiceAccountRequest {
  string team_slug = 1;
  string name = 2;
  string description = 3;
  string role_name = 4;
}

message CreateServiceAccountResponse {
  string id = 1;
  // Whether the service account was created by this call (false if it already
  // existed).
  bool created = 2;
}

message CreateServiceAccountTokenRequest {
  string service_account_id = 1;
  string name = 2;
  string description = 3;
  // Optional expiry. Note: day-granular on the server side.
  optional google.protobuf.Timestamp expires_at = 4;
}

message CreateServiceAccountTokenResponse {
  string id = 1;
  // The plaintext token secret. Only returned once.
  string secret = 2;
}
